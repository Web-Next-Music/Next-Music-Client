<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			body {
				margin: 0;
				height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
				background: __BG_COLOR__;
			}

			body.fade-out {
				transition: opacity __FADE_MS__ms cubic-bezier(0.4, 0, 0.2, 1);
				opacity: 0;
			}

			video {
				width: 100%;
				height: 100%;
				object-fit: contain;
				filter: hue-rotate(130deg);
			}
		</style>
	</head>
	<body>
		<video id="v" autoplay muted playsinline>
			<source src="__VIDEO_SRC__" type="video/webm" />
		</video>
	</body>
</html>
